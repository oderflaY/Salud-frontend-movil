services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-bookworm
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "-c", "/scripts/migrate.sh /migrations && /scripts/set_secrets.sh"]

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      # Rechaza tokens de sesiones cerradas (reset de cuenta desde el
      # dashboard) y de cuentas bloqueadas o dadas de baja. Ver 0016.
      PGRST_DB_PRE_REQUEST: app.verificar_sesion
    ports:
      - "${POSTGREST_PORT}:3000"

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACION_HORAS: ${JWT_EXPIRACION_HORAS}
      ARGON2_SECRET_KEY: ${ARGON2_SECRET_KEY}
      BACKEND_PORT: ${BACKEND_PORT}
      RUST_LOG: ${RUST_LOG}
      # Opcionales: si DEEPSEEK_API_KEY viene vacía, el módulo de IA
      # (resumen de chat, traducción) responde IA_NO_CONFIGURADA (503) y el
      # resto del backend arranca y funciona igual.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODELO: ${DEEPSEEK_MODELO:-deepseek-chat}
      # Traducción del chat con un Ollama propio. Con OLLAMA_URL puesta, el
      # texto del paciente no sale hacia DeepSeek.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODELO_TRADUCCION: ${OLLAMA_MODELO_TRADUCCION:-translategemma:12b}
      # Tercera opción de traducción (Google Cloud Translation v2, API key).
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      # Dashboard web del médico: orígenes del navegador que pueden llamar a /api/v1.
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,red-local}
    ports:
      - "${BACKEND_PORT}:8080"

  proxy:
    image: caddy:2.8-alpine
    depends_on:
      - postgrest
      - backend
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PROXY_PORT}:8000"
      # El dashboard web trae por defecto VITE_API_URL=http://localhost:8081/api/v1.
      - "${DASHBOARD_PORT:-8081}:8000"

  # Perfil aparte: no corre en `docker compose up` normal, solo con
  # `docker compose --profile test run dbtest`.
  dbtest:
    build: ./db
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./db/tests:/tests:ro
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/run_pgtap.sh", "/tests"]

volumes:
  db-data:

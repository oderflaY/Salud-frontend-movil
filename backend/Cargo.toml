[package]
name = "backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = { version = "0.7", features = ["ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "json", "macros"] }

argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"

chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower_governor = "0.4"
tokio-tungstenite = "0.24"
futures-util = "0.3"
dotenvy = "0.15"
# rustls en vez de la TLS por defecto (openssl del sistema) para no depender de
# libssl-dev en la imagen de build — misma elección que sqlx (runtime-tokio-rustls).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
http-body-util = "0.1"
# Servidor HTTP falso para probar el cliente de DeepSeek sin una API key real
# ni depender de la red — ver backend/src/ia/deepseek.rs.
wiremock = "0.6"
